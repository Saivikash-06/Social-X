version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: societal_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: societal_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  core-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile.core
    container_name: core_service
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:password@db:5432/societal_db
      - SECRET_KEY=supersecretkey_please_change_in_production
    depends_on:
      - db
    volumes:
      - ..:/app
    restart: unless-stopped
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  postgres_data:
